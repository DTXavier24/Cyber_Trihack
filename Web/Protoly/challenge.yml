name: "Protoly"
author: "@jingeur"
description: >
  Protoly is a tiny prototyping SaaS. Register an account, poke around, and take over the admin account. The flag lives on the admin dashboard at /admin.

  There's a Report page: submit a same-site link and a reviewer will open it - in the admin's own browser session.
type: DynamicContainer
category: Web
submissionLimit: 5
difficulty: 10
flagTemplate: TriHack26{[GUID]}
container:
  flagTemplate: TriHack26{[GUID]}
  memoryLimit: 512
  cpuCount: 1
  storageLimit: 512
  exposePort: 3000
