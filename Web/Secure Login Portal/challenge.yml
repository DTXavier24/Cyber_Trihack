name: "Secure Login Portal"
author: "@narragonien"
description: >
  The "secure" admin portal claims to be protected against injection. It even scolds you when it catches something suspicious in your input.

  Its blocklist is confident but shallow. Get in as admin and it will hand you the flag.
type: DynamicContainer
category: Web
submissionLimit: 5
difficulty: 10
flagTemplate: TriHack26{[GUID]}
container:
  flagTemplate: TriHack26{[GUID]}
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  exposePort: 3000
