name: "Anbu Archive Terminal"
author: "@KnuckleHead"
description: >
  The Anbu Black Ops have restricted access to top-secret shinobi scrolls. Players must gain access to the terminal to retrieve the classified intel (the flag).
type: DynamicContainer
category: Web
submissionLimit: 5
difficulty: 10
provide: ./dist
flagTemplate: TriHack26{[GUID]}
container:
  flagTemplate: TriHack26{[GUID]}
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  exposePort: 5000
