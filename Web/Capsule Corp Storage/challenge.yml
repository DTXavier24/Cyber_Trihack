name: "Capsule Corp Storage"
author: "@KnuckleHead"
description: >
  Bulma stored the blueprints for the Time Machine inside Capsule Corporation's public web directory. She hid the decryption key somewhere within the terminal interface. Can you find it and recover the blueprints?
type: DynamicContainer
category: Web
submissionLimit: 5
difficulty: 10
flagTemplate: TriHack26{[GUID]}
container:
  flagTemplate: TriHack26{[GUID]}
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  exposePort: 5000
