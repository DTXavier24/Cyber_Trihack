name: "heapdiff"
author: "@x5471"
description: >
  heapdiff is a document diffing service that supports version commits, hunk views, annotations, squashing, and patch export.

  The editor now includes generation checks, allocator noise, and safer preview output. Hunks are rebuilt during squash, stale views are supposed to be rejected, and annotations are limited to tiny writes.
type: DynamicContainer
category: Pwn
submissionLimit: 5
difficulty: 10
provide: ./dist
flagTemplate: TriHack26{[GUID]}
container:
  flagTemplate: TriHack26{[GUID]}
  memoryLimit: 256
  cpuCount: 1
  storageLimit: 256
  exposePort: 5000
